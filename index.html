<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Aegean Blu Mykonos Villas Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
html,body,#wrap,#map{width:100%;height:100%;margin:0} body{font-family:Arial,sans-serif;overflow:hidden} #wrap{position:relative;height:100vh} #map{position:absolute;inset:0} .hdr{position:absolute;top:0;left:0;right:0;z-index:1000;background:rgba(10,16,30,.9);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center} .legend{position:absolute;left:16px;bottom:16px;z-index:1000;background:rgba(255,255,255,.88);padding:12px 16px;border-radius:999px;display:flex;gap:14px;font-size:13px;font-weight:700} .area-group{display:flex;align-items:center;gap:0}.area-pin{width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-right:9px solid #d8b26a;filter:drop-shadow(0 2px 3px rgba(15,23,42,.18));margin-right:-1px;flex-shrink:0} .area-label-box{background:rgba(255,255,255,.98);border:1px solid rgba(15,23,42,.12);color:#0f172a;padding:3px 9px;border-radius:999px;font-size:10px;letter-spacing:1px;font-weight:700;text-transform:uppercase;box-shadow:0 8px 18px rgba(15,23,42,.10);white-space:nowrap;position:relative} .leaflet-top.leaflet-left{margin-top:54px;} .leaflet-control-zoom{margin-top:54px !important;} .marker-dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.95)} .marker-dot.prestige{background:linear-gradient(135deg,#ffb3b3 0%,#d62828 100%)} .marker-dot.luxury-superior{background:linear-gradient(135deg,#dbe5ef 0%,#7c94ab 100%)} .marker-dot.luxury{background:linear-gradient(135deg,#efd9ae 0%,#b47c33 100%)} .popup-card{width:min(88vw, 280px);background:#eef3f7;overflow:hidden;border-radius:4px} .popup-img,.popup-img-placeholder{width:100%;height:140px} .popup-img{object-fit:cover;display:block} .popup-img-placeholder{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a 0%,#334155 100%)} .popup-body{padding:12px 14px 14px} .popup-name{font-weight:700;margin:4px 0 6px} .popup-meta{font-size:11px;color:#667889;margin-bottom:12px} .popup-btn{display:block;text-align:center;background:#d8b26a;color:#3a3a3a!important;text-decoration:none;font-size:9px;font-weight:700;padding:7px;letter-spacing:2px;text-transform:uppercase;border-radius:2px}.popup-btn:hover{opacity:.82;background:#c9a96e} .popup-close{position:absolute;top:6px;right:8px;z-index:9;border:0;border-radius:50%;width:24px;height:24px;background:rgba(18,25,42,.7);color:#d8b26a;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1} .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:transparent;box-shadow:none} .leaflet-popup-content{margin:0!important;width:min(88vw, 280px)!important} .leaflet-popup-close-button{display:none!important}
.search-wrap{position:relative;flex:1;max-width:280px;margin:0 16px}
#villa-search{width:100%;padding:7px 12px;border:none;border-radius:6px;font-size:13px;background:rgba(255,255,255,.95);color:#0f172a;outline:none;box-sizing:border-box}
#villa-search::placeholder{color:#94a3b8}
#search-results{display:none;position:absolute;top:100%;left:0;right:0;margin-top:4px;background:#fff;border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.18);max-height:260px;overflow-y:auto;z-index:1001}
#search-results.open{display:block}
.search-item{padding:10px 14px;cursor:pointer;font-size:13px;color:#0f172a;border-bottom:1px solid #f1f5f9}
.search-item:last-child{border-bottom:none}
.search-item:hover{background:#f8fafc}
.search-item .tier{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#d8b26a;font-weight:700}
.search-item .name{font-weight:600;margin-top:2px}
.search-item .meta{font-size:11px;color:#64748b;margin-top:1px}
@media (max-width:768px){.hdr{padding:10px 12px}.search-wrap{max-width:160px;margin:0 8px}#villa-search{font-size:12px;padding:6px 10px}.legend{left:10px;right:10px;bottom:10px;flex-wrap:wrap;gap:8px;padding:8px 10px;border-radius:14px}}
@media (max-width:480px){.hdr{padding:8px 10px}.search-wrap{max-width:120px;margin:0 6px}#villa-search{font-size:11px;padding:5px 8px}}
</style></head><body><div id="wrap"><div class="hdr"><div>Mykonos</div><div class="search-wrap"><input type="text" id="villa-search" placeholder="Search villas..." autocomplete="off"><div id="search-results"></div></div><div>49 villas</div></div><div id="map"></div><div class="legend"><span><span class="marker-dot prestige" style="display:inline-block;width:12px;height:12px"></span> Prestige</span><span><span class="marker-dot luxury-superior" style="display:inline-block;width:12px;height:12px"></span> Luxury Superior</span><span><span class="marker-dot luxury" style="display:inline-block;width:12px;height:12px"></span> Luxury</span></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
let villas=[];
const markerByName={};
async function boot(){
  const res=await fetch('./villas.json');
  villas=await res.json();
  const tierClass={"Prestige":"prestige","Luxury Superior":"luxury-superior","Luxury":"luxury"};
  const map=L.map('map',{zoomControl:true}).setView([37.447,25.357],12.2);
  setTimeout(()=>{const z=document.querySelector('.leaflet-top .leaflet-left .leaflet-control-zoom');if(z)z.style.marginTop='54px';},0);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png?key=cb1_4afi_1_d01323898555540a6507852f',{maxZoom:19,attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(map);
  const areaLabels=[[37.444141637803234,25.326273061760464,'Mykonos Town / Chora'],[37.434564267908996,25.405874779103076,'Kalo Livadi'],[37.41508326355238,25.368711300639983,'Super Paradise'],[37.42408639812317,25.322825138164013,'Ornos'],[37.414407789424374,25.344390254907626,'Platis Gialos'],[37.461312245232605,25.375125967262743,'Ftelia'],[37.41636167271824,25.33817549558542,'Psarou'],[37.40787624185309,25.348874344057357,'Paraga'],[37.46621469477314,25.32296117361929,'Tourlos / Ferry Port'],[37.43498086063748,25.346507014339636,'Mykonos Airport'],[37.41040711252341,25.35687227270592,'Paradise'],[37.42279962143255,25.390412443320503,'Elia'],[37.44091683435456,25.4204004131557,'Kalafati'],[37.44515900582333,25.435727608049564,'Lia'],[37.475410998843,25.360621891735004,'Panormos']];
  areaLabels.forEach(a=>L.marker([a[0],a[1]],{icon:L.divIcon({className:'',html:`<div class="area-group"><div class="area-pin"></div><div class="area-label-box">${a[2]}</div></div>`,iconSize:[1,1],iconAnchor:[0,0]})}).addTo(map));
  const cluster=L.markerClusterGroup({showCoverageOnHover:false,chunkedLoading:true});
  function popupHtml(v){
    const img=v.photo_url?`<img src="${v.photo_url}" class="popup-img" alt="${v.name}">`:'<div class="popup-img-placeholder"><span style="color:#d8b26a;letter-spacing:2px;font-size:10px">AEGEAN BLU</span></div>';
    return `<div class="popup-card"><button type="button" class="popup-close">&times;</button>${img}<div class="popup-body"><div style="font-size:9px;letter-spacing:2px;color:#d8b26a;text-transform:uppercase;font-weight:700">${v.tier}</div><div class="popup-name">${v.name}</div><div class="popup-meta">${v.area} • ${v.beds} bedrooms • up to ${v.guests} guests</div><a class="popup-btn" href="${v.url}" target="_blank" rel="noopener">View Villa</a></div></div>`;
  }
  villas.forEach(v=>{
    const cls=tierClass[v.tier]||'luxury';
    const m=L.marker([v.lat,v.lng],{icon:L.divIcon({className:'',html:`<div class="marker-dot ${cls}"></div>`,iconSize:[14,14],iconAnchor:[7,7]})});
    m.bindPopup(popupHtml(v),{maxWidth:300,className:'custom-popup'});
    cluster.addLayer(m);
    markerByName[v.name]=m;
  });
  map.addLayer(cluster);
  if(villas.length)map.fitBounds(cluster.getBounds().pad(0.2));
  map.on('popupopen',ev=>{const el=ev.popup.getElement();if(!el)return;const b=el.querySelector('.popup-close');if(b)b.onclick=()=>ev.popup.remove();});
  const searchInput=document.getElementById('villa-search');
  const searchResults=document.getElementById('search-results');
  function showResults(q){
    const query=q.trim().toLowerCase();
    if(!query){searchResults.classList.remove('open');searchResults.innerHTML='';return;}
    const matches=villas.filter(v=>v.name.toLowerCase().includes(query)||v.area.toLowerCase().includes(query)).slice(0,12);
    if(!matches.length){searchResults.innerHTML='<div class="search-item" style="color:#94a3b8;cursor:default">No villas found</div>';searchResults.classList.add('open');return;}
    searchResults.innerHTML=matches.map(v=>`<div class="search-item" data-name="${v.name.replace(/"/g,'&quot;')}"><div class="tier">${v.tier}</div><div class="name">${v.name}</div><div class="meta">${v.area} · ${v.beds} beds · ${v.guests} guests</div></div>`).join('');
    searchResults.classList.add('open');
  }
  searchInput.addEventListener('input',e=>showResults(e.target.value));
  searchInput.addEventListener('focus',e=>{if(e.target.value.trim())showResults(e.target.value);});
  searchResults.addEventListener('click',e=>{
    const item=e.target.closest('.search-item');
    if(!item||!item.dataset.name)return;
    const name=item.dataset.name;
    const marker=markerByName[name];
    if(!marker)return;
    searchResults.classList.remove('open');
    searchInput.value=name;
    map.setView(marker.getLatLng(),15,{animate:true});
    cluster.zoomToShowLayer(marker,()=>{marker.openPopup();});
  });
  document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))searchResults.classList.remove('open');});
}
boot();
</script></body></html>
