<style>
html,body,#wrap,#map{width:100%;height:100%;margin:0} body{font-family:Arial,sans-serif;overflow:hidden} #wrap{position:relative;height:100vh} #map{position:absolute;inset:0} .hdr{position:absolute;top:0;left:0;right:0;z-index:1000;background:rgba(10,16,30,.9);color:#fff;padding:12px 18px;display:flex;justify-content:space-between} .legend{position:absolute;left:16px;bottom:16px;z-index:1000;background:rgba(255,255,255,.88);padding:12px 16px;border-radius:999px;display:flex;gap:14px;font-size:13px;font-weight:700} .legend .leg-item{font-size:13px;letter-spacing:1px;color:#5f6b7a} .legend .leg-dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);vertical-align:middle} .area-group{display:flex;align-items:center;gap:6px}.area-pin{width:11px;height:11px;border-radius:50%;background:#d8b26a;border:2px solid rgba(255,255,255,.95);box-shadow:0 8px 18px rgba(15,23,42,.18)} .area-label-box{background:rgba(255,255,255,.98);border:1px solid rgba(15,23,42,.12);color:#0f172a;padding:3px 9px;border-radius:999px;font-size:10px;letter-spacing:1px;font-weight:700;text-transform:uppercase;box-shadow:0 8px 18px rgba(15,23,42,.10);white-space:nowrap;position:relative} .leaflet-top.leaflet-left{margin-top:54px;} .leaflet-control-zoom{margin-top:54px !important;} .marker-dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.95)} .marker-dot.prestige{background:linear-gradient(135deg,#ffb3b3 0%,#d62828 100%)} .marker-dot.luxury-superior{background:linear-gradient(135deg,#dbe5ef 0%,#7c94ab 100%)} .marker-dot.luxury{background:linear-gradient(135deg,#efd9ae 0%,#b47c33 100%)} .popup-card{width:min(88vw, 280px);background:#eef3f7;overflow:hidden;border-radius:4px} .popup-img,.popup-img-placeholder{width:100%;height:140px} .popup-img{object-fit:cover;display:block} .popup-img-placeholder{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a 0%,#334155 100%)} .popup-body{padding:12px 14px 14px} .popup-name{font-weight:700;margin:4px 0 6px} .popup-meta{font-size:11px;color:#667889;margin-bottom:12px} .popup-btn{display:block;text-align:center;background:#d8b26a;color:#3a3a3a!important;text-decoration:none;font-size:9px;font-weight:700;padding:7px;letter-spacing:2px;text-transform:uppercase;border-radius:2px;opacity:1;transition:opacity .18s ease, background-color .18s ease, transform .18s ease;}.popup-btn, .popup-btn:visited{color:#3a3a3a!important;} .popup-btn:hover{opacity:.82;background:#c9a96e;color:#3a3a3a!important;transform:none;} .popup-card .popup-btn, .popup-btn:visited{color:#3a3a3a!important;} .popup-btn:hover{opacity:.82;background:#c9a96e;color:#3a3a3a!important;transform:none;} .popup-close{position:absolute;top:6px;right:8px;z-index:9;border:0;border-radius:50%;width:24px;height:24px;background:rgba(18,25,42,.7);color:#d8b26a;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;} .popup-close:hover{cursor:pointer;} .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:transparent;box-shadow:none} .leaflet-popup-content{margin:0!important;width:min(88vw, 280px)!important} .leaflet-popup-close-button{display:none!important} 
@media (max-width: 768px){
  .hdr{padding:10px 12px}
  .hdr-title,.hdr-sub{font-size:10px;letter-spacing:2px}
  .legend{left:10px;right:10px;bottom:10px;flex-wrap:wrap;gap:8px;padding:8px 10px;border-radius:14px;font-size:11px}

}
@media (max-width: 480px){
